name: Lint & Validate Lab Assets

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-python:
    name: Python Script Syntax & Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Syntax & Lint Check
        run: |
          # Check for Python syntax errors or undefined names
          flake8 attack-payloads/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warning check for PEP8 compliance
          flake8 attack-payloads/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

  validate-detection-rules:
    name: Validate Sigma Detection Rules (YAML)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate YAML Formatting
        run: |
          python -c "
          import glob, yaml, sys
          files = glob.glob('detection-rules/*.yaml')
          for f in files:
              try:
                  with open(f, 'r') as stream:
                      yaml.safe_load(stream)
                  print(f'[PASS] {f}')
              except Exception as e:
                  print(f'[FAIL] {f}: {e}')
                  sys.exit(1)
          "

      - name: Run Detection-as-Code Unit Tests
        run: python tests/test_detection_rules.py

