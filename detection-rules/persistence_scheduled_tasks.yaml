title: Scheduled Task Creation for Persistence
id: b8f73b64-5678-4bcd-88ef-987654321cba
status: experimental
description: Detects scheduled task creation via process creation events targeting schtasks.exe with creation flags, commonly used by threat actors for persistence.
author: Nayan Solanki
references:
  - https://attack.mitre.org/techniques/T1053/005/
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    EventID: 1
    Image|endswith: '\schtasks.exe'
    CommandLine|contains:
      - '/create'
  condition: selection
fields:
  - Image
  - CommandLine
  - ParentImage
  - User
falsepositives:
  - Legitimate administrative script tasks created during installation
level: medium
tags:
  - attack.persistence
  - attack.t1053.005
