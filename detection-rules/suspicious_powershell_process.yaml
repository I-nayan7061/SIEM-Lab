title: Suspicious Obfuscated or Base64 Encoded PowerShell Execution (Process Creation)
id: c4e3b129-9876-4abc-99ef-987654321def
status: experimental
description: Detects execution of PowerShell with suspicious command-line parameters (EncodedCommand, IEX, DownloadString) via Process Creation.
author: Nayan Solanki
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1027/
logsource:
  product: windows
  category: process_creation
detection:
  selection_process:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains:
      - '-enc '
      - '-encodedcommand '
      - '-e '
      - 'invoke-expression'
      - 'iex '
      - 'downloadstring'
      - 'system.net.webclient'
  condition: selection_process
fields:
  - ComputerName
  - User
  - Image
  - CommandLine
  - ParentImage
falsepositives:
  - Legitimate enterprise deployment scripts (SCCM, Chocolatey, IT automation)
level: high
tags:
  - attack.execution
  - attack.t1059.001
  - attack.defense_evasion
  - attack.t1027
